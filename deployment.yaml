apiVersion: apps/v1
kind: Deployment
metadata:
  name: devops-web-app
spec:
  replicas: 3
  selector:
    matchLabels:
      app: devops-web-app
  template:
    metadata:
      labels:
        app: devops-web-app
    spec:
      containers:
        - name: devops-container
          image: devops-web:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3001
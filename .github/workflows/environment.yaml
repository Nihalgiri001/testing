name: Environment Exploration

on: [push]

jobs:
  explore:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Show environment
        run: |
          node --version
          npm --version

      - name: Install dependencies
        run: npm install
